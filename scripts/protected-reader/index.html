<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7f8fa">
  <title>私人阅读室</title>
  <link rel="stylesheet" href="/r/39d8c650/reader.css">
  <script src="/r/39d8c650/reader.js" defer></script>
</head>
<body>
  <section id="gate" class="gate">
    <div class="gate-inner">
      <div class="gate-mark">{{BookOpen}}</div>
      <p class="eyebrow">PRIVATE READING</p>
      <h1>私人阅读室</h1>
      <p class="gate-subtitle">凭访问密码，打开这份专属资料。</p>
      <form id="unlock-form">
        <label for="password">访问密码</label>
        <div class="password-field"><input id="password" name="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required><button id="reveal" class="icon-button" type="button" title="显示密码" aria-label="显示密码" aria-pressed="false">{{Eye}}</button></div>
        <button id="unlock" class="primary" type="submit">{{KeyRound}}<span>打开阅读室</span></button>
        <p id="gate-status" role="status" aria-live="polite"></p>
      </form>
      <p class="gate-foot">资料已加密 · 刷新页面后需重新解锁</p>
    </div>
  </section>
  <div id="workspace" hidden>
    <header class="topbar">
      <button id="menu" class="icon-button mobile-only" title="阅读目录" aria-label="阅读目录" aria-expanded="false" aria-controls="sidebar">{{Menu}}</button>
      <a class="brand" href="#report">{{BookOpen}}<span>私人阅读室<small>02 · 研究与记录</small></span></a>
      <div class="top-actions"><button id="copy" class="icon-button" title="复制当前篇" aria-label="复制当前篇">{{Copy}}</button><button id="download" class="icon-button" title="下载全部资料" aria-label="下载全部资料">{{Download}}</button><button id="lock" class="icon-button" title="锁定阅读室" aria-label="锁定阅读室">{{LockKeyhole}}</button></div>
    </header>
    <button id="backdrop" class="backdrop" aria-label="关闭目录" hidden></button>
    <aside id="sidebar" class="sidebar" aria-label="阅读目录">
      <div class="sidebar-heading"><span>资料目录</span><button id="close-menu" class="icon-button mobile-only" aria-label="关闭目录" title="关闭目录">{{X}}</button></div>
      <nav id="documents" aria-label="文章分类"></nav>
      <div class="chapter-heading">本篇目录</div>
      <nav id="chapters" class="chapters" aria-label="本篇目录"></nav>
    </aside>
    <main class="main">
      <div class="reading-toolbar"><span id="reading-count"></span><div class="type-controls"><button id="font-down" class="icon-button" title="缩小字号" aria-label="缩小字号">{{Minus}}</button><span id="font-value">18</span><button id="font-up" class="icon-button" title="放大字号" aria-label="放大字号">{{Plus}}</button><button id="theme" class="icon-button" title="切换深色阅读" aria-label="切换深色阅读">{{Moon}}</button></div></div>
      <header class="article-header"><p id="category" class="eyebrow"></p><h1 id="article-title" tabindex="-1"></h1><p id="article-subtitle"></p></header>
      <article id="content"></article>
      <footer class="article-footer"><button id="previous" class="page-link" type="button">{{ArrowLeft}}<span></span></button><button id="next" class="page-link" type="button"><span></span>{{ArrowRight}}</button></footer>
    </main>
    <div class="progress"><span id="progress"></span></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
