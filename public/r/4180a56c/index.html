<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7f8fa">
  <title>私人阅读室</title>
  <link rel="stylesheet" href="/r/39d8c650/reader.css">
  <script src="/r/39d8c650/reader.js" defer></script>
</head>
<body>
  <section id="gate" class="gate">
    <div class="gate-inner">
      <div class="gate-mark"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open " aria-hidden="true" focusable="false"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></div>
      <p class="eyebrow">PRIVATE READING</p>
      <h1>私人阅读室</h1>
      <p class="gate-subtitle">凭访问密码，打开这份专属资料。</p>
      <form id="unlock-form">
        <label for="password">访问密码</label>
        <div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required><button id="reveal" class="icon-button" type="button" title="显示密码" aria-label="显示密码" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye " aria-hidden="true" focusable="false"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
        <button id="unlock" class="primary" type="submit"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-key-round " aria-hidden="true" focusable="false"><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"></path><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle></svg><span>打开阅读室</span></button>
        <p id="gate-status" role="status" aria-live="polite"></p>
      </form>
      <p class="gate-foot">资料已加密 · 刷新页面后需重新解锁</p>
    </div>
  </section>
  <div id="workspace" hidden>
    <header class="topbar">
      <button id="menu" class="icon-button mobile-only" title="阅读目录" aria-label="阅读目录" aria-expanded="false" aria-controls="sidebar"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu " aria-hidden="true" focusable="false"><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg></button>
      <a class="brand" href="#report"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open " aria-hidden="true" focusable="false"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg><span>私人阅读室<small>02 · 研究与记录</small></span></a>
      <div class="top-actions"><button id="copy" class="icon-button" title="复制当前篇" aria-label="复制当前篇"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy " aria-hidden="true" focusable="false"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></button><button id="download" class="icon-button" title="下载全部资料" aria-label="下载全部资料"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download " aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg></button><button id="lock" class="icon-button" title="锁定阅读室" aria-label="锁定阅读室"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock-keyhole " aria-hidden="true" focusable="false"><circle cx="12" cy="16" r="1"></circle><rect x="3" y="10" width="18" height="12" rx="2"></rect><path d="M7 10V7a5 5 0 0 1 10 0v3"></path></svg></button></div>
    </header>
    <button id="backdrop" class="backdrop" aria-label="关闭目录" hidden></button>
    <aside id="sidebar" class="sidebar" aria-label="阅读目录">
      <div class="sidebar-heading"><span>资料目录</span><button id="close-menu" class="icon-button mobile-only" aria-label="关闭目录" title="关闭目录"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x " aria-hidden="true" focusable="false"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
      <nav id="documents" aria-label="文章分类"></nav>
      <div class="chapter-heading">本篇目录</div>
      <nav id="chapters" class="chapters" aria-label="本篇目录"></nav>
    </aside>
    <main class="main">
      <div class="reading-toolbar"><span id="reading-count"></span><div class="type-controls"><button id="font-down" class="icon-button" title="缩小字号" aria-label="缩小字号"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-minus " aria-hidden="true" focusable="false"><path d="M5 12h14"></path></svg></button><span id="font-value">18</span><button id="font-up" class="icon-button" title="放大字号" aria-label="放大字号"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus " aria-hidden="true" focusable="false"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button><button id="theme" class="icon-button" title="切换深色阅读" aria-label="切换深色阅读"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon " aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></button></div></div>
      <header class="article-header"><p id="category" class="eyebrow"></p><h1 id="article-title" tabindex="-1"></h1><p id="article-subtitle"></p></header>
      <article id="content"></article>
      <footer class="article-footer"><button id="previous" class="page-link" type="button"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left " aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg><span></span></button><button id="next" class="page-link" type="button"><span></span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right " aria-hidden="true" focusable="false"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button></footer>
    </main>
    <div class="progress"><span id="progress"></span></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
